<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batch Solver</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <details class="settings">
            <summary aria-label="Settings" title="Settings">⚙</summary>
            <div class="settings-panel">
                <nav class="settings-nav" aria-label="Settings categories">
                    <button type="button" class="active" data-settings-tab="general" onclick="selectSettingsCategory('general')">General</button>
                    <button type="button" data-settings-tab="image" onclick="selectSettingsCategory('image')">Image</button>
                    <button type="button" data-settings-tab="esq" onclick="selectSettingsCategory('esq')">ESQ</button>
                </nav>
                <div class="settings-content">
                    <section class="settings-section" data-settings-panel="general">
                        <h2>Settings</h2>
                        <label>Sort algorithms by
                            <select id="sortBy"><option value="STM">STM</option><option value="SQTM">SQTM</option><option value="ESQ">ESQ</option></select>
                        </label>
                        <label>Secondary metric
                            <select id="secondary-metric"><option value="None">None</option><option value="STM">STM</option><option value="SQTM">SQTM</option><option value="ESQ">ESQ</option></select>
                        </label>
                        <input type="checkbox" id="statVis" checked hidden>
                        <label><input type="checkbox" id="showPostAdj"> Show ending adjustments</label>
                        <label>Solutions per case <input type="number" class="inputNum" id="maxSolutions" value="5" min="1"></label>
                    </section>
                    <section class="settings-section" data-settings-panel="image" id="settings-image-panel" hidden></section>
                    <section class="settings-section" data-settings-panel="esq" id="settings-esq-panel" hidden></section>
                </div>
            </div>
        </details>

        <h1>Batch Solver</h1>

        <section id="input-area">
            <div class="solver-config-row">
            <div class="puzzle-config">
                <div class="search-left">
                    <div class="unique-heading">
                        <label class="field-label" for="ignore">Unique Orientations &amp; Equivalences</label>
                        <label class="mask-mode-toggle" title="Use mask from Unique Orientations">
                            <input type="checkbox" id="generatedMask" onchange="maskModeChanged('generated')">
                            <svg viewBox="0 0 36 36" aria-hidden="true">
                                <defs>
                                    <linearGradient id="mask-rainbow" gradientUnits="userSpaceOnUse" x1="-36" y1="0" x2="0" y2="36">
                                        <stop offset="0" stop-color="#ff4d6d"/><stop offset=".17" stop-color="#ff9f43"/><stop offset=".34" stop-color="#ffe66d"/><stop offset=".5" stop-color="#4dd599"/><stop offset=".67" stop-color="#4da3ff"/><stop offset=".84" stop-color="#735dff"/><stop offset="1" stop-color="#e05dff"/>
                                        <animate attributeName="x1" values="-36;36" dur="2.2s" repeatCount="indefinite"/>
                                        <animate attributeName="x2" values="0;72" dur="2.2s" repeatCount="indefinite"/>
                                    </linearGradient>
                                </defs>
                                <g class="mask-icon-sad">
                                    <path d="M4 6c4.7 1.8 9.3 2.7 14 2.7S27.3 7.8 32 6c.1 10-1.7 17.1-5.4 21.3C24 30.3 21.1 32 18 32s-6-1.7-8.6-4.7C5.7 23.1 3.9 16 4 6Z"/>
                                    <path class="mask-feature" d="M9.5 15.5c1.8-1.5 3.6-1.5 5.4 0M21.1 15.5c1.8-1.5 3.6-1.5 5.4 0M12.2 25c3.9-3.1 7.7-3.1 11.6 0"/>
                                </g>
                                <g class="mask-icon-happy">
                                    <path d="M4 6c4.7 1.8 9.3 2.7 14 2.7S27.3 7.8 32 6c.1 10-1.7 17.1-5.4 21.3C24 30.3 21.1 32 18 32s-6-1.7-8.6-4.7C5.7 23.1 3.9 16 4 6Z"/>
                                    <path class="mask-feature" d="M9.5 16.5c1.8 1.5 3.6 1.5 5.4 0M21.1 16.5c1.8 1.5 3.6 1.5 5.4 0M12 22c1.3 4.7 10.7 4.7 12 0"/>
                                </g>
                            </svg>
                        </label>
                    </div>
                    <textarea id="ignore" hidden spellcheck="false"></textarea>
                    <div id="ignore-editor" aria-label="Unique orientations editor"></div>
                    <div class="subgroup-panel">
                        <span class="field-label">Moveset</span>
                        <div id="move-grid" class="move-grid"></div>
                        <input class="subgroup" type="hidden">
                    </div>
                    <div class="right-depth-controls">
                        <div class="depth-adjustments">
                            <div class="depth-control">
                                <label for="prune-depth">Prune</label>
                                <div class="stepper"><button type="button" onclick="changeDepth('prune-depth', -1)">−</button><input id="prune-depth" class="prune" type="number" value="3" min="0" max="20" readonly><button type="button" onclick="changeDepth('prune-depth', 1)">+</button></div>
                            </div>
                            <div class="depth-control">
                                <label for="search-depth">Search</label>
                                <div class="stepper"><button type="button" onclick="changeDepth('search-depth', -1)">−</button><input id="search-depth" class="search" type="number" value="5" min="0" max="20" readonly><button type="button" onclick="changeDepth('search-depth', 1)">+</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="run-config">
            <div class="category-launchers">
                <details class="category-popover">
                    <summary>ESQ</summary>
                    <div id="esqOptions" class="category-panel">
                        <h2>ESQ</h2>
                        <label>Rank ESQ<textarea id="rankESQ" rows="6">R_ L_ r_ l_: 1
R2 L2 r2 l2: 2
__: 2
_2: 3</textarea></label>
                        <label>Generation ESQ
                            <select id="esq-gen-select" onchange="esqGenSelected(this)"><option value="default">Default</option><option value="match">Match</option><option value="custom" selected>Custom</option></select>
                        </label>
                        <div id="genESQarea"><textarea id="generationESQ" rows="6"></textarea></div>
                    </div>
                </details>

                <details class="category-popover image-options-popover output-popover">
                    <summary class="icon-button" title="Image options" aria-label="Image options">⚙</summary>
                    <section id="imageOptions" class="category-panel">
                        <h2>Image Options</h2>
                        <label><input type="checkbox" id="imageVis" checked> Show images</label>
                        <label>Image type <select id="img-select" onchange="imageSelected(this)"><option value="3x3x3-top">3x3x3 top</option><option value="3x3x3">3x3x3</option></select></label>
                        <label>Image size <input type="number" class="inputNum" id="imgSize" value="150" oninput="generateImagePreview()"></label>
                        <div id="imgRot"><label>X rotation <input type="number" class="inputNum" id="imgPitch" value="30" oninput="generateImagePreview()"></label><label>Y rotation <input type="number" class="inputNum" id="imgYaw" value="40" oninput="generateImagePreview()"></label></div>
                        <label><input type="checkbox" id="overrideMask" onchange="maskModeChanged('override')"> Override mask</label>
                        <input id="faceletColors" type="text" maxlength="54" spellcheck="false" oninput="generateImagePreview()">
                        <label><input type="checkbox" id="previewVis" onclick="previewToggled(this)"> Show preview</label>
                        <div id="imgPreview" hidden></div>
                        <input hidden type="range" id="previewYaw" oninput="generateImagePreview()" value="0" min="-265" max="265" step="1">
                    </section>
                </details>

                <details class="category-popover case-sorting-popover output-popover">
                    <summary class="icon-button" title="Case sorting" aria-label="Case sorting">↕</summary>
                    <div class="category-panel case-sorting-panel">
                        <table id="sorting-table">
                            <caption>Case Sorting</caption>
                            <tr id="sorting-row-2">
                                <td><select class="sorting-type"><option value="priority">Set priority</option><option value="ori-of">Orientation of</option><option value="ori-at">Orientation at</option><option value="perm-of">Permutation of</option><option value="perm-at">Permutation at</option></select></td>
                                <td><textarea class="sorting-pieces" rows="1" spellcheck="false"></textarea></td>
                                <td><button class="button up-sorting" onclick="sortButtonHandler(this)">▲</button></td>
                                <td><button class="button down-sorting" onclick="sortButtonHandler(this)">▼</button></td>
                                <td><button class="button add-sorting" onclick="sortButtonHandler(this)">+</button></td>
                                <td><button disabled class="button remove-sorting" onclick="sortButtonHandler(this)">−</button></td>
                            </tr>
                        </table>
                    </div>
                </details>
            </div>
            </aside>
            <div class="right-config">
                <div class="scramble-row">
                    <div class="scramble-field">
                        <label class="field-label" for="solve">Scramble</label>
                        <textarea id="solve" hidden spellcheck="false"></textarea>
                        <div id="scramble-editor" aria-label="Scramble editor"></div>
                    </div>
                </div>
                <div class="inline-adjustments">
                    <label for="pre-adjustments">Pre-Adjust
                        <textarea id="pre-adjustments" rows="1" spellcheck="false">U</textarea>
                    </label>
                    <label for="post-adjustments">Post-Adjust
                        <textarea id="post-adjustments" rows="1" spellcheck="false">U</textarea>
                    </label>
                </div>
            </div>
            </div>
        </section>

        <div class="results-layout">
        <div id="table-area">
            <div class="output-heading">
                <h2>Solver</h2>
                <div class="output-title-actions">
                    <button class="header-icon action-start" onclick="searchButtonHandler()" id="calc-button" title="Start search" aria-label="Start search">▶</button>
                    <button hidden class="header-icon action-clear" onclick="clearOutput()" id="clear-button" title="Clear output" aria-label="Clear output"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1h4a1 1 0 1 1 0 2h-1l-.8 14.1A2 2 0 0 1 15.2 22H8.8a2 2 0 0 1-2-1.9L6 6H5a1 1 0 0 1 0-2h4V3Zm2 1h2V3h-2v1ZM8 6l.8 14h6.4L16 6H8Zm2.5 3a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 1 1 1-1Zm3 0a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1Z"/></svg></button>
                </div>
            </div>
            <div class="output-column-labels">
                <div class="output-column-title image-title">
                    <span>Image</span>
                </div>
                <div class="output-column-title solutions-title">
                    <span>Solutions</span>
                    <div class="solution-actions-right">
                        <button hidden class="header-icon action-export" onclick="exportTable()" id="select-button" title="Export output" aria-label="Export output"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3a1 1 0 0 1 2 0v10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3V3ZM5 19h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2Z"/></svg></button>
                        <details class="category-popover case-sorting-popover output-popover output-case-sorting">
                            <summary class="header-icon" title="Case sorting" aria-label="Case sorting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4a1 1 0 0 1 1 1v11.6l2.3-2.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L7 16.6V5a1 1 0 0 1 1-1Zm7-1h5a1 1 0 1 1 0 2h-5a1 1 0 1 1 0-2Zm0 6h4a1 1 0 1 1 0 2h-4a1 1 0 1 1 0-2Zm0 6h3a1 1 0 1 1 0 2h-3a1 1 0 1 1 0-2Z"/></svg></summary>
                        </details>
                    </div>
                </div>
            </div>
            <div id="output-grid"></div>
        </div>
        <section id="statistics"><div id="statistics-data"><h2>Statistics</h2><div>Case: <span id="info-this-case">0</span>/<span id="info-num-cases">0</span> <span class="tooltip"><span id="info-fails"></span><span class="tooltiptext" id="myTooltip">Copy to clipboard</span></span></div><div>Rate: <span id="info-time">0.00 sec/case</span></div><div>STM: <span id="info-stm">0.00</span></div><div>SQTM: <span id="info-sqtm">0.00</span></div><div>ESQ: <span id="info-esq">0.00</span></div></div></section>
        </div>
    </main>
    <p class="page-credit">
        Based on Trangium's Batch Solver
        <span aria-hidden="true">·</span>
        <a href="https://github.com/trangium/trangium.github.io" target="_blank" rel="noopener noreferrer">Original project</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/mike-zb/Batch-Solver" target="_blank" rel="noopener noreferrer">Source code</a>
    </p>
    <canvas hidden id="canvas" width="150" height="150"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js" crossorigin="anonymous"></script>
    <script src="twistysim.js"></script>
    <script src="app.js"></script>
</body>
</html>
